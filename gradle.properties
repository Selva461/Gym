org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 in full mode: more aggressive optimisation and obfuscation than the compat
# mode, and the default from AGP 8 onwards. Stated explicitly so that the build's
# security posture is something this file asserts rather than something it
# inherits and could silently lose.
android.enableR8.fullMode=true

# Keep the build reproducible-ish and the dependency set honest: a new transitive
# dependency that wants a permission shows up as a manifest merge change rather
# than appearing silently in the merged manifest.
android.nonFinalResIds=false

# The iOS targets can only be built on a Mac. On Linux (the Android CI job) they are
# skipped quietly instead of warning on every build.
kotlin.native.ignoreDisabledTargets=true

# KSP1 rather than KSP2. KSP2 (the 2.1.21-2.0.x default) cannot resolve
# kotlin.coroutines.Continuation when Room processes the iOS targets, and fails
# with "cannot find required type XTypeName[kotlin.coroutines.Continuation]" on
# every suspend DAO function. KSP1 is the path Room's multiplatform support was
# first built and tested on, for Android and iOS alike.
ksp.useKSP2=false
