name: Build iOS app

# Not on every push. This repository is private, and GitHub bills a macOS minute
# as ten Linux ones: one iOS build costs about as much as ten Android builds.
# It runs when main moves, and on demand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Compile for iPhone and package an unsigned IPA
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The newest Xcode 16 on the image. Kotlin 2.1 is tested against Xcode 16;
      # a newer major may work, but a build that silently changes toolchain under
      # the app is not one to debug from a phone.
      - name: Choose Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The Kotlin/Native toolchain carries the native standard library. Gradle
      # fetches it only when a native compile task runs, and Room's code generator
      # (KSP) runs before those — so on a fresh runner KSP analyses the code with
      # no standard library at all and fails with "cannot find required type
      # kotlin.coroutines.Continuation". Fetched first, from Maven Central, at the
      # version the project pins.
      - name: Provision the Kotlin/Native toolchain
        run: |
          KOTLIN=$(grep -E '^kotlin = ' gradle/libs.versions.toml | cut -d'"' -f2)
          case "$(uname -m)" in arm64) ARCH=aarch64 ;; *) ARCH=x86_64 ;; esac
          DIST="kotlin-native-prebuilt-macos-$ARCH-$KOTLIN"
          if [ ! -f "$HOME/.konan/$DIST/konan/konan.properties" ]; then
            mkdir -p "$HOME/.konan"
            curl -fsSL --retry 4 \
              "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-native-prebuilt/$KOTLIN/kotlin-native-prebuilt-$KOTLIN-macos-$ARCH.tar.gz" \
              | tar -xz -C "$HOME/.konan"
          fi
          ls "$HOME/.konan/$DIST"

      # Compiling the shared code on its own first means a Kotlin error is reported
      # here, plainly, rather than buried in an Xcode build phase's output.
      - name: Compile shared code for iOS
        run: |
          set -o pipefail
          gradle :app:compileKotlinIosArm64 --no-daemon 2>&1 | tee /tmp/ios-kotlin.log || {
            echo "──────── Kotlin errors ────────"
            grep -E "^e: |What went wrong|Could not" -A2 /tmp/ios-kotlin.log | head -80
            exit 1
          }

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # Unsigned on purpose: signing needs an Apple account, and a signature made
      # here would be replaced anyway by the one Sideloadly or AltStore applies with
      # yours. See README, "Installing on an iPhone".
      - name: Build the app
        run: |
          if ! xcodebuild \
              -project iosApp/Gym.xcodeproj \
              -scheme Gym \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              GRADLE_BIN="$(which gradle)" \
              build > /tmp/xcode.log 2>&1; then
            echo "──────── what failed ────────"
            grep -E "^e: |error:|\*\* BUILD FAILED" /tmp/xcode.log | head -80
            echo "──────── last lines ────────"
            tail -40 /tmp/xcode.log
            exit 1
          fi
          tail -3 /tmp/xcode.log

      - name: Package an unsigned IPA
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/Gym.app
          test -d "$APP"
          # The bundled demonstrations and food dataset must be inside the app, or
          # it starts with no demos and without the Indian dataset.
          find "$APP" -name "*.csv" | head -3
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry gym-unsigned.ipa Payload
          ls -la gym-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: gym-unsigned-ipa
          path: gym-unsigned.ipa
          if-no-files-found: error

      # Beside the APK, at a fixed address:
      #   https://github.com/Selva461/Gym/releases/download/latest-ios/gym-unsigned.ipa
      - name: Publish the IPA where a phone or PC can download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-ios
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Gym — latest iOS build (unsigned)" \
            --prerelease \
            --notes "Replaced by the newest successful iOS build."
          gh release upload "$TAG" gym-unsigned.ipa --clobber
          gh release edit "$TAG" --notes "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.

          **Unsigned.** iOS installs only apps signed for your device, so this file has to be signed with your own Apple ID on the way onto the phone. Sideloadly (Windows or Mac) or AltStore does that for free; with a free Apple ID the app must be re-signed every 7 days. See the README, *Installing on an iPhone*.

          Download **gym-unsigned.ipa** below."
