org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 in full mode: more aggressive optimisation and obfuscation than the compat
# mode, and the default from AGP 8 onwards. Stated explicitly so that the build's
# security posture is something this file asserts rather than something it
# inherits and could silently lose.
android.enableR8.fullMode=true

# Keep the build reproducible-ish and the dependency set honest: a new transitive
# dependency that wants a permission shows up as a manifest merge change rather
# than appearing silently in the merged manifest.
android.nonFinalResIds=false
