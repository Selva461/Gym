name: Build APK

# Every branch, not just main. The APK is the deliverable and it is wanted from
# whichever branch the work is on — a branch filter here means pushing a fix and
# getting nothing back.
on:
  push:
  pull_request:
  workflow_dispatch:

# `write` is needed to publish the APK as a release asset. Nothing else in this
# workflow writes to the repository.
permissions:
  contents: write

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    # Read once at job level so the optional release steps below can test for their
    # presence. A secret that was never created resolves to an empty string, which is
    # exactly the signal those steps check.
    env:
      GYM_KEYSTORE_BASE64: ${{ secrets.GYM_KEYSTORE_BASE64 }}
      GYM_KEYSTORE_PASSWORD: ${{ secrets.GYM_KEYSTORE_PASSWORD }}
      GYM_KEY_ALIAS: ${{ secrets.GYM_KEY_ALIAS }}
      GYM_KEY_PASSWORD: ${{ secrets.GYM_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` is set explicitly. The action's default is "tools platform-tools",
      # and Google has withdrawn the legacy `tools` package from the SDK repository —
      # sdkmanager exits 1 with "Failed to find package 'tools'" and the job dies
      # before Gradle ever starts. Naming what this build actually needs avoids it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --- Audit gates -------------------------------------------------
      # Debug variant only. The release unit tests run the same code against the
      # same JVM and just double the wall clock.
      # --stacktrace is deliberately absent. On a Kotlin compile failure Gradle
      # prints a two-hundred-line internal stack trace that says nothing except
      # "compilation failed", and it buries the "e: file:..." lines that say what
      # is actually wrong — far enough up that reading the tail of the log, which
      # is all the API hands back, shows only the trace. The summary below repeats
      # the real errors as the last thing in the step so they are always visible.
      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee /tmp/gym-build.log || {
            echo "::group::Compile and test errors"
            echo "──────── errors, repeated here so they are the last thing in this log ────────"
            grep -E "^e: |FAILED$|^[0-9]+\) " /tmp/gym-build.log | head -80
            echo "──────────────────────────────────────────────────────────────────────────────"
            echo "::endgroup::"
            exit 1
          }

      - name: Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      # --- Deliverable -------------------------------------------------
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # The exported Room schema is the reference MigrationSqlTest checks against, and
      # it is the record of what each database version actually looked like. Worth
      # having out of the build rather than only inside it.
      - name: Upload database schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # An Actions artifact is a zip behind a GitHub login, which is close to
      # unusable on a phone. A release asset is a direct .apk link that any browser
      # can download, so the build publishes one and keeps it at a fixed tag: the
      # URL never changes, only what sits behind it.
      #
      #   https://github.com/Selva461/Gym/releases/download/latest-debug/gym-debug.apk
      - name: Publish the APK where a phone can download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk gym-debug.apk
          TAG=latest-debug
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Gym — latest debug build" \
            --prerelease \
            --notes "Replaced by the newest successful build. Debug build, signed with the repository's fixed debug key."
          gh release upload "$TAG" gym-debug.apk --clobber
          gh release edit "$TAG" --notes "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.

          Debug build, signed with the repository's fixed debug key, so each build installs over the last one without losing data.

          Download **gym-debug.apk** below."

      # MigrationSqlTest skips rather than fails when the exported schema is absent,
      # which was the right call — a test that withholds a working APK over where
      # KSP put a file got the trade backwards, and it did that twice. But a check
      # that can quietly stop checking needs something watching it, or the migration
      # goes unverified and nobody finds out until Room throws on somebody's phone.
      #
      # This is that watcher. It runs after the APK has been built and published, so
      # a problem here is loud without ever costing the deliverable, and it reads the
      # version out of GymDatabase.kt so it cannot go stale when the schema moves on.
      # success() rather than always(). On its first outing this step ran after a
      # failed compile, found no exported schema — because KSP never got that far —
      # and reported "the v5 migration is UNVERIFIED", which was true but had nothing
      # to do with why the build broke. A watcher that speaks up when the thing it
      # watches never ran is a watcher that hides the real error.
      - name: Confirm the migration check was not silently skipped
        if: success()
        run: |
          VERSION=$(grep -oP 'version\s*=\s*\K[0-9]+' app/src/main/java/dev/avles/gym/data/GymDatabase.kt | head -1)
          # Searched, not assumed. Room keys the directory on the fully qualified
          # class name, and hardcoding that path is what let MigrationSqlTest skip
          # silently from the day it was written — it looked under
          # dev.avles.gym.GymDatabase while the class lives in dev.avles.gym.data.
          FOUND=$(find app/schemas -name "${VERSION}.json" -path "*GymDatabase*" 2>/dev/null | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::No ${VERSION}.json under any *GymDatabase directory, so MigrationSqlTest skipped and the v${VERSION} migration is UNVERIFIED."
            echo "What is actually in app/schemas:"
            find app/schemas -type f 2>/dev/null | sed 's/^/  /' || echo "  (no app/schemas directory at all)"
            exit 1
          fi
          echo "Schema v${VERSION} found at $FOUND — MigrationSqlTest compared the migration against it."
          grep -o '"defaultValue"[^,}]*' "$FOUND" | head -5

      # Room's exported schema, committed rather than left in a build directory.
      #
      # Room's own guidance is to keep these in version control, and for good reason:
      # they are the record of what each database version actually looked like, and a
      # migration is only reviewable against them.
      #
      # This project has a sharper reason. MigrationSqlTest skipped silently from the
      # day it was written because it looked for the schema under the wrong package,
      # and nothing could see that the file was absent — a skipped test is a green
      # build, and the schema lived only in a build directory nobody reads. A file in
      # the repository cannot hide. The diff also makes a schema change something you
      # have to look at rather than something that happens.
      #
      # [skip ci] keeps this from triggering itself.
      - name: Commit the exported Room schema
        if: success()
        run: |
          if [ -z "$(git status --porcelain app/schemas 2>/dev/null)" ]; then
            echo "Exported schema unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          git commit -m "Export Room schema from CI [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # --- Optional: a signed, non-debuggable release APK ---------------
      # The debug APK above is debuggable, which means anyone holding your unlocked
      # phone with USB debugging on can read the database out of it. For a health log
      # that is worth closing. Create a keystore, add these four repository secrets,
      # and every build also produces a release APK that is not debuggable:
      #
      #   keytool -genkey -v -keystore gym-release.jks -alias gym \
      #           -keyalg RSA -keysize 2048 -validity 10000
      #   base64 -w0 gym-release.jks        # the value for GYM_KEYSTORE_BASE64
      #
      #   GYM_KEYSTORE_BASE64  GYM_KEYSTORE_PASSWORD  GYM_KEY_ALIAS  GYM_KEY_PASSWORD
      #
      # With the secrets absent every step here is skipped and nothing else changes.
      - name: Decode signing keystore
        if: env.GYM_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$GYM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gym-release.jks"
          echo "GYM_KEYSTORE_PATH=$RUNNER_TEMP/gym-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        if: env.GYM_KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: env.GYM_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: gym-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Shred the keystore
        if: always() && env.GYM_KEYSTORE_BASE64 != ''
        run: shred -u "$RUNNER_TEMP/gym-release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/gym-release.jks"

      # The last step in the job, so its output is the last thing in the log.
      #
      # The Unit tests step already greps its own errors out, but anything printed
      # mid-job is unreachable when the only way to read the log is its tail — which
      # is the situation from a terminal, where the raw log lives on a host that is
      # often unreachable. Repeating them here costs nothing and makes a compile
      # error legible without opening a browser.
      - name: Repeat the failure at the end of the log
        if: failure()
        run: |
          echo "════════ what actually failed ════════"
          if [ -f /tmp/gym-build.log ]; then
            grep -E "^e: |^w: .*error|FAILED$|^[0-9]+\) |AssertionError" /tmp/gym-build.log | head -60 \
              || echo "(no compile or test errors in the build log — the failure was in a later step)"
          else
            echo "(no build log: the job failed before Gradle ran)"
          fi
          echo "══════════════════════════════════════"
